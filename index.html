<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Darshana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎉 Happy Birthday Darshana 🎉</h1>
    <p>From Doraemon, Nobita, Shizuka, Gian, Suneo, and Dorami!</p>
  </header>

  <!-- Doraemon and Friends Wishing -->
  <section id="characters">
    <img src="images/doraemon-birthday.png" 
         alt="Doraemon and friends wishing Happy Birthday Darshana" 
         style="max-width:100%; border-radius:12px;">
  </section>

  <!-- Doraemon Flying & Eating Doracakes -->
  <section id="doraemon-fun">
    <h2>Doraemon Celebrates!</h2>
    <video controls autoplay loop>
      <source src="videos/doraemon-flying.mp4" type="video/mp4">
    </video>
    <video controls autoplay loop>
      <source src="videos/doraemon-doracakes.mp4" type="video/mp4">
    </video>
  </section>

  <!-- Nobita Desk / Time Machine -->
  <section id="time-machine">
    <h2>Nobita Desk</h2>
    <button onclick="openTimeMachine()">Open Nobita Desk</button>
  </section>

  <!-- 4D Gadget Photo Lab -->
  <section id="photo-lab">
    <h2>Upload Your Face</h2>
    <input type="file" id="faceUpload" accept="image/*">
    <button onclick="generateAnimation()">Generate Doraemon Animation</button>
    <div id="animationResult"></div>
  </section>

  <!-- Anywhere Door -->
  <section id="anywhere-door">
    <h2>Anywhere Door</h2>
    <img src="images/anywhere-door.png" alt="Anywhere Door" id="doorImage" onclick="openDoorVideo()">
    <div id="doorVideo"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
